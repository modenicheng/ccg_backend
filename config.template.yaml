ccg:
  database:
    url: postgresql+asyncpg://postgres:postgres@localhost:5432/ccg
    echo: false

  redis:
    url: redis://localhost:6379/0

  qq_music:
    cookie: ""
    # Cookie list for rotation (optional, can be from env or here)
    # - "cookie_string_1"
    # - "cookie_string_2"
    # - "cookie_string_3"
    rotation:
      enabled: true
      strategy: round_robin  # Options: round_robin, primary_first
      failure_max_retries: 3  # Mark cookie unhealthy after 3 failures
    refresh:
      enabled: true
      check_interval_seconds: 1800  # Check and refresh every 30 minutes

  songlist:
    fetch:
      concurrency: 8
      retries: 5
      backoff_seconds: 0.4

  audio:
    download:
      retries: 3
      backoff_seconds: 0.4
      dir: assets/audio
    token:
      ttl: 21600

  song:
    url:
      retries: 3
      backoff_seconds: 0.4

  app:
    log_level: INFO

  cache:
    asset:
      max_items: 64
