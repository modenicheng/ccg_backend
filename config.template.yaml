ccg:
  database:
    url: postgresql+asyncpg://postgres:postgres@localhost:5432/ccg
    echo: false

  redis:
    url: redis://localhost:6379/0

  qq_music:
    cookie: ""

  songlist:
    fetch:
      concurrency: 8
      retries: 5
      backoff_seconds: 0.4

  audio:
    download:
      retries: 3
      backoff_seconds: 0.4
      dir: assets/audio
    token:
      ttl: 21600

  song:
    url:
      retries: 3
      backoff_seconds: 0.4

  app:
    log_level: INFO

  cache:
    asset:
      max_items: 64
